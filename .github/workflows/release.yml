name: Release ZPulse

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configurar .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 🔨 Compilar e Empacotar Executável Único (.exe)
        shell: pwsh
        run: |
          # Extrai a versão a partir da tag git (ex: v1.0.0 -> 1.0.0)
          $tag = "${{ github.ref_name }}".TrimStart('v')
          Write-Host "Compilando ZPulse na versão $tag..."
          
          dotnet publish ZPulse.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$tag `
            -p:AssemblyVersion=$tag `
            -p:FileVersion=$tag `
            -p:InformationalVersion=$tag `
            -o ./publish

      - name: 📦 Criar Arquivo ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/ZPulse.exe -DestinationPath ./publish/ZPulse-windows-x64.zip

      - name: 🚀 Publicar GitHub Release com Changelog Automático
        uses: softprops/action-gh-release@v2
        with:
          name: "ZPulse ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            ./publish/ZPulse.exe
            ./publish/ZPulse-windows-x64.zip
